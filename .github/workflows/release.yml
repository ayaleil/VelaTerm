# Packaging pipeline for the fork.
#
# Upstream's own release driver (scripts/release.sh) and its Git Bash fetcher (scripts/fetch-gitbash.ps1) are
# referenced by electron-builder.yml and scripts/dev-desktop.sh but are not published in the repository, so
# this workflow reimplements the parts a fork needs instead of calling them:
#
#   · linux-appimage — the Electron edition, which is the only desktop app Linux ships. Its backend is the
#     `sidecar` Cargo build (no Tauri/WebKit/GTK), so the AppImage runs on hosts without WebKitGTK. The
#     frontend is built first because rust-embed resolves ../dist at compile time for release profiles.
#   · windows-nsis / macos-dmg — the Tauri edition, built natively so no Rust cross-toolchain is involved.
#
# Each job uploads its artifact. A tag push additionally attaches every artifact to a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-appimage:
    name: linux AppImage (Electron + sidecar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # font-kit links against the system fontconfig/freetype even in the Tauri-free sidecar build.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev libfreetype6-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux-sidecar-release

      - run: pnpm install --frozen-lockfile

      # Must precede the Cargo build: the release profile embeds dist/ into the velaterm binary.
      - name: Build the frontend
        run: pnpm build

      - name: Build the sidecar backend
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --no-default-features --features sidecar

      # The productName and executableName overrides reproduce the identity of the AppImage this fork
      # replaces: its executable is `velaterm`, not the `velaterm-electron` that electron-builder would derive
      # from the productName in electron-builder.yml. The data directories are unaffected either way — they
      # come from the package.json name and from serve_identifier in the Rust core, not from packaging.
      - name: Package the AppImage
        run: |
          pnpm exec electron-builder --linux AppImage \
            -c.productName=VelaTerm \
            -c.linux.executableName=velaterm

      - uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: dist-electron/*.AppImage
          if-no-files-found: error

  windows-nsis:
    name: windows installer (Tauri)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-gui-release

      - run: pnpm install --frozen-lockfile

      # tauri.windows.conf.json bundles src-tauri/resources/gitbash/**/*, which is gitignored and produced by
      # the unpublished scripts/fetch-gitbash.ps1. The override clears that resource so the bundle can be
      # built from a clean clone; terminal sessions then fall back to PowerShell instead of the bundled Git
      # Bash (see agent/gitbash.rs). Drop the override once the resource can be provisioned here.
      - name: Build the Tauri bundle
        run: pnpm tauri build --config .github/tauri.no-gitbash.conf.json

      - uses: actions/upload-artifact@v7
        with:
          name: windows-nsis
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  macos-dmg:
    name: macOS dmg (Tauri, unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-gui-release

      - run: pnpm install --frozen-lockfile

      # No Developer ID is configured for the fork, so the bundle is unsigned and not notarized: macOS will
      # quarantine it until the user clears the attribute by hand.
      - name: Build the Tauri bundle
        run: pnpm tauri build

      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish:
    name: attach artifacts to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-appimage, windows-nsis, macos-dmg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "$tag" --notes "Fork build of $tag. The macOS bundle is unsigned."
          gh release upload "$tag" artifacts/* --clobber
