# Packaging pipeline for the fork.
#
# Upstream's own release driver (scripts/release.sh) is referenced by electron-builder.yml but is not published
# in the repository, so this workflow reimplements the parts a fork needs instead of calling it. Its Git Bash
# fetcher was not published either; scripts/fetch-gitbash.ps1 is the fork's reimplementation.
#
#   · linux-appimage — the Electron edition, which is the only desktop app Linux ships. Its backend is the
#     `sidecar` Cargo build (no Tauri/WebKit/GTK), so the AppImage runs on hosts without WebKitGTK. The
#     frontend is built first because rust-embed resolves ../dist at compile time for release profiles.
#   · windows-nsis / macos-dmg — the Tauri edition, built natively so no Rust cross-toolchain is involved.
#     Windows ships two installers like upstream: `min` bundles a trimmed Git Bash, `full` all of PortableGit.
#
# Each job uploads its artifact. A tag push additionally attaches every artifact to a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The build jobs run third-party install and build scripts, so they get a read-only token; only the job that
# creates the release needs write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-appimage:
    name: linux AppImage (Electron + sidecar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # font-kit links against the system fontconfig/freetype even in the Tauri-free sidecar build.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev libfreetype6-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux-sidecar-release

      - run: pnpm install --frozen-lockfile

      # Must precede the Cargo build: the release profile embeds dist/ into the velaterm binary.
      - name: Build the frontend
        run: pnpm build

      - name: Build the sidecar backend
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --no-default-features --features sidecar

      # The productName and executableName overrides reproduce the identity of the AppImage this fork
      # replaces: its executable is `velaterm`, not the `velaterm-electron` that electron-builder would derive
      # from the productName in electron-builder.yml. The data directories are unaffected either way — they
      # come from the package.json name and from serve_identifier in the Rust core, not from packaging.
      # --publish never matters: electron-builder's default is onTagOrDraft, so on a tag in CI it tries to
      # upload the artifact itself and fails demanding GH_TOKEN. Uploading is the publish job's work, which is
      # the only job holding a write-scoped token; this job deliberately has none.
      - name: Package the AppImage
        run: |
          pnpm exec electron-builder --linux AppImage \
            --publish never \
            -c.productName=VelaTerm \
            -c.linux.executableName=velaterm

      # electron-builder cannot produce a minisign signature, so the AppImage is signed with the Tauri CLI,
      # which is where the key already lives. Skipped off a tag because the manifest embeds the release URL.
      - name: Sign the AppImage and write its update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          appimage=$(ls dist-electron/*.AppImage)
          pnpm exec tauri signer sign "$appimage"
          python3 -I .github/scripts/updater-manifest.py linux "$appimage" \
            --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" \
            > dist-electron/latest-linux-x86_64.json

      - uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: |
            dist-electron/*.AppImage
            dist-electron/*.AppImage.sig
            dist-electron/latest-linux-x86_64.json
          if-no-files-found: error

  windows-nsis:
    name: windows installer (Tauri, ${{ matrix.variant }} Git Bash)
    runs-on: windows-latest
    strategy:
      matrix:
        variant: [min, full]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-gui-release-${{ matrix.variant }}

      - run: pnpm install --frozen-lockfile

      # tauri.windows.conf.json bundles src-tauri/resources/gitbash/**/*, which is gitignored and must exist
      # before the build: tauri_build resolves the glob in build.rs, and the bundler resolves it again when
      # packaging. The script pins PortableGit by SHA-256 and fails the job on a mismatch.
      - name: Bundle Git Bash (${{ matrix.variant }})
        run: pwsh scripts/fetch-gitbash.ps1 -Variant ${{ matrix.variant }}

      # createUpdaterArtifacts in tauri.conf.json makes this emit the `.sig` next to each installer; the key
      # has to be present at build time because Tauri signs the updater artifact as it bundles it.
      - name: Build the Tauri bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      # Both variants come out with the same file names, which would collide in the release, so they are
      # renamed after upstream's assets. Each `.sig` follows its artifact: the updater manifest pairs them by name.
      - name: Name the installers after the variant
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          move_with_sig() { mv "$1" "$2" && { [ ! -f "$1.sig" ] || mv "$1.sig" "$2.sig"; }; }
          bundle=src-tauri/target/release/bundle
          move_with_sig "$(ls "$bundle"/nsis/*-setup.exe)" "$bundle/nsis/velaterm-x64-$VARIANT-setup.exe"
          move_with_sig "$(ls "$bundle"/msi/*.msi)" "$bundle/msi/velaterm-x64-$VARIANT.msi"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-nsis-${{ matrix.variant }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sig
          if-no-files-found: error

  macos-dmg:
    name: macOS dmg (Tauri, unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-gui-release

      - run: pnpm install --frozen-lockfile

      # No Developer ID is configured for the fork, so the bundle is unsigned and not notarized: macOS will
      # quarantine it until the user clears the attribute by hand.
      - name: Build the Tauri bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      # The dmg is what a person installs; the updater downloads the .app.tar.gz, so both are published.
      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  publish:
    name: attach artifacts to the release
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-appimage, windows-nsis, macos-dmg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # The Tauri updater reads one manifest covering every platform, so it can only be assembled once all
      # three builds have uploaded. The script exits non-zero rather than publishing an empty manifest, which
      # would leave Windows and macOS silently never updating. The manifest holds one Windows installer, and it
      # points at `full`: an update replaces the whole install, and only `full` keeps ssh and git working.
      - name: Write the Tauri update manifest
        run: |
          python3 -I .github/scripts/updater-manifest.py tauri artifacts \
            --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" \
            > artifacts/latest.json
          cat artifacts/latest.json

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "$tag" --notes "Fork build of $tag. The macOS bundle is unsigned."
          # Not artifacts/*: merge-multiple flattens the artifacts into one directory but keeps the folder
          # structure inside each, so the Tauri bundles arrive under dmg/, macos/, nsis/ and msi/, and gh
          # refuses a directory with "is a directory". Assets are uploaded by basename either way.
          find artifacts -type f -print0 | xargs -0 gh release upload "$tag" --clobber
