# Builds vela-server unsigned on pull requests that can affect it, so a break shows up before a release tag does.
name: vela-server check

on:
  pull_request:
    paths:
      - src-tauri/**
      - src/**
      - package.json
      - pnpm-lock.yaml
      - scripts/build-vela-server.sh
      - .github/scripts/server-manifest.py
      - .github/workflows/vela-server*.yml

concurrency:
  group: vela-server-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vela-server:
    uses: ./.github/workflows/vela-server.yml
    with:
      sign: false
