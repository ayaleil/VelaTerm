# electron-builder packaging configuration for the Electron edition of VelaTerm.
#
# Output: scripts/release.sh builds the Linux AppImage (the Linux desktop release) and deep-signs the optional
# macOS Electron build with a Developer ID. The script controls the signing identity, so it is not hard-coded
# here. The Linux AppImage updates itself through the desktop update service (see electron/main.cjs).
# Remaining work for other platforms: macOS notarization, Windows signing, and self-update. These require an
# Apple ID and the corresponding certificates; see the mac section below and the publish notes at the end.
# Signing alone, without notarization, is sufficient for native UNUserNotificationCenter alerts.
#
# Important: the sidecar (`velaterm --serve`) serves the renderer (frontend UI) over local HTTP, so the
# renderer is **not bundled into the Electron package**. Consequently, `files` includes only the shell code;
# the frontend's node_modules are not needed at runtime. During release builds, rust-embed embeds the frontend
# UI into the velaterm binary (`cargo build --release`), which is then packaged through `extraResources`.

appId: io.vlinx.vlxterm.electron
# Use the distinct name VelaTerm-Electron so it can coexist with the Tauri VelaTerm.app in ~/Soft (see scripts/release.sh).
productName: VelaTerm-Electron
copyright: Copyright © VLINX Software

directories:
  output: dist-electron
  buildResources: build

# Package only the files required by the shell. The renderer comes from the sidecar, so neither dist/ nor
# frontend dependencies are needed. The electron/*.cjs shell uses only the Electron runtime and Node built-ins;
# explicitly exclude all of node_modules to prevent electron-builder from needlessly adding roughly 200 MB of
# frontend packages from package.json dependencies (CodeMirror, Milkdown, and others) to app.asar.
files:
  - electron/**/*
  - "!electron/**/*.test.cjs"
  - package.json
  - "!node_modules/**/*"

# Bundle the release velaterm binary as a resource; packaged builds resolve it from process.resourcesPath in main.cjs.
extraResources:
  # Native window geometry is a presentation resource shared with the Tauri host.
  - from: src-tauri/resources/window-layout.json
    to: window-layout.json
  # Attribution required by the bundled Material Symbols (Apache-2.0) and Fluent UI icons (MIT).
  - from: THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
  - from: src-tauri/target/release/velaterm
    to: velaterm
  # Window/taskbar icons: in packaged builds, windowIcon() in main.cjs reads these from resources/icons
  # (Windows .ico / Linux .png). win.icon below already embeds the executable icon through rcedit;
  # these files provide the runtime window icon.
  - from: src-tauri/icons
    to: icons
    filter:
      - icon.ico
      - 128x128.png

asar: true

# AppImage toolset with the static type-2 runtime: the AppImage mounts through the kernel's FUSE without the
# system libfuse2, which current Ubuntu and Fedora desktops no longer install by default. The legacy default
# ("0.0.0") needs libfuse2 and fails to start without it.
toolsets:
  appimage: "1.0.3"

mac:
  category: public.app-category.developer-tools
  icon: src-tauri/icons/icon.icns
  hardenedRuntime: true
  target:
    - dmg
    - zip
  # scripts/release.sh controls the signing identity; do not hard-code it here:
  #   · With a configured Developer ID (and the sign command available), the script passes the certificate
  #     name through -c.mac.identity. electron-builder then deep-signs every nested Helper/Framework and the
  #     sidecar binary inside the .app, which a single raw codesign invocation cannot do.
  #   · Without a certificate, the script sets CSC_IDENTITY_AUTO_DISCOVERY=false to retain the existing
  #     unsigned-package behavior.
  # Notarization remains release follow-up work. Signing alone enables native UNUserNotificationCenter alerts.

win:
  icon: src-tauri/icons/icon.ico
  target:
    - nsis

# Linux ships this edition as its only desktop app. scripts/release.sh overrides the product name, executable
# name and artifact name so the AppImage keeps the name, file name and data directory of the Tauri AppImage
# it replaces. Its backend is the `sidecar` build of velaterm (no WebKitGTK). electron-builder's AppRun adds
# --no-sandbox by itself where unprivileged user namespaces are unavailable (for example Ubuntu 24.04).
linux:
  icon: src-tauri/icons/icon.png
  category: Development
  synopsis: Terminal and AI agent session manager
  target:
    - AppImage

# macOS/Windows automatic updates (placeholder): electron-updater requires a publish provider (such as GitHub
# or S3) and signed packages. This remains follow-up work. Uncomment and complete this example when enabling it:
# publish:
#   provider: github
#   owner: <your-org>
#   repo: vlx-term
